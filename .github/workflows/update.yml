name: update

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Read the latest release
        id: update
        run: echo "version=$(./update.sh | awk '{print $3}')" >> "$GITHUB_OUTPUT"
      - name: Check that it builds
        run: |
          git diff --quiet release.json && exit 0
          nix build --print-build-logs
      - name: Commit
        run: |
          git diff --quiet release.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "bb desktop ${{ steps.update.outputs.version }}"
          git push
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(jq -r .version release.json)
          gh release view "v$v" >/dev/null 2>&1 && exit 0
          gh release create "v$v" --target "$(git rev-parse HEAD)" \
            --title "bb desktop $v" \
            --notes "Wraps [bb desktop $v](https://github.com/get-bb/bb/releases/tag/desktop-v$v). Run with \`nix run github:${{ github.repository }}/v$v\`, or \`nix run github:${{ github.repository }}\` for the latest."
